spring.application.name=session-09-logging

# Enable standard Logstash-compatible JSON structure natively
logging.structured.format.console=logstash

# Set default root log level
logging.level.root=INFO

# Detailed logging for your specific package
logging.level.com.re.session09=DEBUG

# Define log file name and path
logging.file.name=logs/spring-boot-app.log

# Console pattern with colors
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight(%-5level) %cyan(%logger{39}) %green(%msg%n)